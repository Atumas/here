<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>VISUAL AI AGENT WORKBENCH :: Fedora 44 Zero-Trust Bash Compiler Suite</title>
<!--
================================================================================
  SINGLE-FILE VISUAL AI AGENT WORKBENCH  (index.html)
--------------------------------------------------------------------------------
  TARGET HOST .......: Fedora 44 / KDE Plasma / Bash 5.x
  RUNTIME MODEL .....: Browser GUI  <==WS==>  Local Bridge Daemon  ==>  /bin/bash
  DEPENDENCIES ......: ZERO (no CDN, no npm, no fonts, pure native browser APIs)
  SECURITY POSTURE ..: Zero-Trust 5-Level Pipeline (see SecurityShieldSanitizer)
                        L1 Input scrubbing  -> L2 JSON serialization
                        L3 Adversarial dry-run validation -> L4 Daemon frame check
                        L5 Volatile stdin shell ingestion (no .sh files on disk)
  ARCHITECTURAL NODES: file_reader | directory_list | ollama_inference
================================================================================
-->
<style>
/* ========================================================================== */
/* THEME MATRIX — deep charcoal glassmorphism / space-mono / neon accents     */
/* ========================================================================== */
:root{
  --bg:#0a0c10;
  --bg-2:#0f1218;
  --panel:rgba(19,23,31,.72);
  --panel-solid:#131720;
  --glass-blur:blur(14px);
  --line:#232a36;
  --line-soft:#1a2029;
  --txt:#d7dee9;
  --txt-dim:#8b97a8;
  --txt-faint:#5a6577;
  --neon-green:#3dff9e;
  --neon-cyan:#2ee6ff;
  --neon-amber:#ffc857;
  --neon-red:#ff5470;
  --neon-violet:#a78bfa;
  --mono:'Space Mono','JetBrains Mono',ui-monospace,'Cascadia Mono','DejaVu Sans Mono',Menlo,Consolas,monospace;
  --radius:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:
    radial-gradient(1200px 600px at 85% -10%, rgba(46,230,255,.06), transparent 60%),
    radial-gradient(900px 500px at -10% 110%, rgba(167,139,250,.06), transparent 60%),
    var(--bg);
  color:var(--txt);
  font-family:var(--mono);
  font-size:13px;
  line-height:1.55;
  overflow:hidden;
}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#242c39;border-radius:6px}
::-webkit-scrollbar-thumb:hover{background:#313b4c}

/* ---------- APP SHELL ---------- */
#app-shell{display:flex;flex-direction:column;height:100vh}
header#topbar{
  display:flex;align-items:center;gap:14px;
  padding:10px 16px;
  background:linear-gradient(180deg,#12161e 0%, #0d1017 100%);
  border-bottom:1px solid var(--line);
  flex:0 0 auto;
}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.5px}
.brand .logo-dot{
  width:12px;height:12px;border-radius:3px;
  background:conic-gradient(from 0deg,var(--neon-green),var(--neon-cyan),var(--neon-violet),var(--neon-green));
  box-shadow:0 0 12px rgba(46,230,255,.6);
}
.brand small{color:var(--txt-faint);font-weight:400;display:block;font-size:10px;letter-spacing:1.5px}
.topbar-spacer{flex:1}
.pill{
  display:inline-flex;align-items:center;gap:7px;
  padding:4px 11px;border-radius:999px;font-size:11px;
  border:1px solid var(--line);background:#0e1219;color:var(--txt-dim);
  white-space:nowrap;
}
.pill .dot{width:8px;height:8px;border-radius:50%;background:#4b5563}
.pill.ok{border-color:rgba(61,255,158,.35);color:var(--neon-green)}
.pill.ok .dot{background:var(--neon-green);box-shadow:0 0 8px var(--neon-green)}
.pill.bad{border-color:rgba(255,84,112,.4);color:var(--neon-red)}
.pill.bad .dot{background:var(--neon-red);box-shadow:0 0 8px var(--neon-red)}
.pill.warn{border-color:rgba(255,200,87,.4);color:var(--neon-amber)}
.pill.warn .dot{background:var(--neon-amber);box-shadow:0 0 8px var(--neon-amber)}
button.btn{
  font-family:var(--mono);font-size:12px;cursor:pointer;
  background:#161b24;color:var(--txt);
  border:1px solid var(--line);border-radius:8px;
  padding:7px 13px;transition:all .15s ease;
}
button.btn:hover{border-color:var(--neon-cyan);color:var(--neon-cyan);box-shadow:0 0 10px rgba(46,230,255,.15)}
button.btn.primary{border-color:rgba(61,255,158,.5);color:var(--neon-green)}
button.btn.primary:hover{background:rgba(61,255,158,.08);box-shadow:0 0 12px rgba(61,255,158,.25)}
button.btn.danger{border-color:rgba(255,84,112,.5);color:var(--neon-red)}
button.btn.danger:hover{background:rgba(255,84,112,.08);box-shadow:0 0 12px rgba(255,84,112,.25)}
button.btn.violet{border-color:rgba(167,139,250,.5);color:var(--neon-violet)}
button.btn.violet:hover{background:rgba(167,139,250,.08)}
button.btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}

/* ---------- MAIN GRID ---------- */
#main-grid{display:flex;flex:1;min-height:0}
nav#sidebar{
  flex:0 0 218px;display:flex;flex-direction:column;gap:2px;
  padding:14px 10px;background:#0c0f15;border-right:1px solid var(--line);
  overflow-y:auto;
}
.nav-section-label{font-size:10px;letter-spacing:2px;color:var(--txt-faint);padding:12px 8px 5px}
.nav-item{
  display:flex;align-items:center;gap:9px;
  padding:9px 10px;border-radius:8px;cursor:pointer;
  color:var(--txt-dim);border:1px solid transparent;
  font-size:12px;user-select:none;transition:all .15s ease;
}
.nav-item:hover{background:#121722;color:var(--txt)}
.nav-item.active{
  background:linear-gradient(90deg,rgba(46,230,255,.10),rgba(46,230,255,.02));
  border-color:rgba(46,230,255,.35);color:var(--neon-cyan);
  box-shadow:inset 2px 0 0 var(--neon-cyan);
}
.nav-item .ico{width:16px;text-align:center;flex:0 0 16px}
.sidebar-foot{margin-top:auto;padding:10px 8px;font-size:10px;color:var(--txt-faint);border-top:1px dashed var(--line)}

main#view-host{
  flex:1;min-width:0;overflow-y:auto;padding:16px 18px 40px;
}

/* ---------- GLASS PANELS ---------- */
.glass-panel{
  background:var(--panel);
  backdrop-filter:var(--glass-blur);
  -webkit-backdrop-filter:var(--glass-blur);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:14px 16px;
  margin-bottom:14px;
}
.panel-title{
  display:flex;align-items:center;gap:8px;
  font-size:11px;letter-spacing:2px;color:var(--txt-dim);
  text-transform:uppercase;margin-bottom:12px;
}
.panel-title::before{content:"";width:7px;height:7px;border-radius:2px;background:var(--neon-cyan);box-shadow:0 0 8px var(--neon-cyan)}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
@media(max-width:1100px){.grid-2,.grid-3{grid-template-columns:1fr}}

/* ---------- FORM CONTROLS ---------- */
label.field{display:block;margin-bottom:10px}
label.field span{display:block;font-size:10px;letter-spacing:1.5px;color:var(--txt-faint);margin-bottom:4px;text-transform:uppercase}
input[type=text],input[type=number],select,textarea{
  width:100%;font-family:var(--mono);font-size:12px;
  background:#0c1017;color:var(--txt);
  border:1px solid var(--line);border-radius:7px;
  padding:8px 10px;outline:none;transition:border .15s;
}
input:focus,select:focus,textarea:focus{border-color:var(--neon-cyan);box-shadow:0 0 0 2px rgba(46,230,255,.12)}
textarea{resize:vertical;min-height:70px}
.switch-row{display:flex;align-items:center;gap:10px;padding:6px 0}
.switch{position:relative;width:38px;height:20px;flex:0 0 38px}
.switch input{opacity:0;width:0;height:0}
.slider{
  position:absolute;inset:0;background:#1c2330;border:1px solid var(--line);
  border-radius:999px;cursor:pointer;transition:.2s;
}
.slider::before{
  content:"";position:absolute;left:2px;top:2px;width:14px;height:14px;
  border-radius:50%;background:#57627a;transition:.2s;
}
.switch input:checked + .slider{border-color:var(--neon-green);background:rgba(61,255,158,.12)}
.switch input:checked + .slider::before{transform:translateX(18px);background:var(--neon-green);box-shadow:0 0 8px var(--neon-green)}

/* ---------- CODE BLOCKS ---------- */
pre.code-block{
  background:#0a0d13;border:1px solid var(--line);border-radius:8px;
  padding:12px;font-size:11.5px;line-height:1.5;
  overflow-x:auto;max-height:420px;overflow-y:auto;
  color:#c3ccd9;white-space:pre;
}
pre.code-block .hl-risk{color:var(--neon-red);background:rgba(255,84,112,.12);border-radius:3px;padding:0 2px}
pre.code-block .hl-ok{color:var(--neon-green)}
pre.code-block .hl-meta{color:var(--txt-faint)}

/* ---------- CONSOLE ---------- */
.console{
  background:#07090d;border:1px solid var(--line);border-radius:8px;
  height:300px;overflow-y:auto;padding:10px 12px;font-size:12px;
}
.console .ln{white-space:pre-wrap;word-break:break-word;padding:1px 0}
.console .ln.sys{color:var(--txt-faint)}
.console .ln.out{color:#c3ccd9}
.console .ln.err{color:var(--neon-red)}
.console .ln.ok{color:var(--neon-green)}
.console .ln.warn{color:var(--neon-amber)}
.console .ln.net{color:var(--neon-cyan)}
.console .ln.sec{color:var(--neon-violet)}

/* ---------- CHAT ---------- */
.chat-log{display:flex;flex-direction:column;gap:10px;max-height:440px;overflow-y:auto;padding:4px}
.chat-msg{border:1px solid var(--line);border-radius:9px;padding:9px 12px;max-width:88%}
.chat-msg.user{align-self:flex-end;background:rgba(46,230,255,.07);border-color:rgba(46,230,255,.3)}
.chat-msg.agent{align-self:flex-start;background:#10141c}
.chat-msg.system{align-self:center;background:rgba(255,200,87,.06);border-color:rgba(255,200,87,.3);font-size:11px;color:var(--neon-amber)}
.chat-msg .who{font-size:9px;letter-spacing:2px;color:var(--txt-faint);text-transform:uppercase;margin-bottom:3px}
.chat-msg pre{white-space:pre-wrap;word-break:break-word;font-size:12px}

/* ---------- TABLES ---------- */
table.data{width:100%;border-collapse:collapse;font-size:11.5px}
table.data th{
  text-align:left;padding:7px 9px;color:var(--txt-faint);
  border-bottom:1px solid var(--line);letter-spacing:1px;font-weight:400;text-transform:uppercase;font-size:10px;
}
table.data td{padding:7px 9px;border-bottom:1px solid var(--line-soft);vertical-align:top}
.tag{display:inline-block;padding:1px 8px;border-radius:999px;font-size:10px;border:1px solid var(--line)}
.tag.pass{color:var(--neon-green);border-color:rgba(61,255,158,.4)}
.tag.blocked{color:var(--neon-red);border-color:rgba(255,84,112,.4)}
.tag.warn{color:var(--neon-amber);border-color:rgba(255,200,87,.4)}
.tag.info{color:var(--neon-cyan);border-color:rgba(46,230,255,.4)}

/* ---------- KPI CARDS ---------- */
.kpi-row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.kpi{
  flex:1;min-width:150px;background:#0e1219;border:1px solid var(--line);
  border-radius:10px;padding:12px 14px;
}
.kpi .k-label{font-size:9px;letter-spacing:2px;color:var(--txt-faint);text-transform:uppercase}
.kpi .k-value{font-size:22px;margin-top:4px;color:var(--txt)}
.kpi.green .k-value{color:var(--neon-green);text-shadow:0 0 12px rgba(61,255,158,.35)}
.kpi.red .k-value{color:var(--neon-red);text-shadow:0 0 12px rgba(255,84,112,.35)}
.kpi.cyan .k-value{color:var(--neon-cyan)}
.kpi.amber .k-value{color:var(--neon-amber)}

/* ---------- PIPELINE DIAGRAM ---------- */
.pipeline{display:flex;flex-direction:column;gap:0;margin:8px 0}
.pipe-stage{
  border:1px solid var(--line);border-radius:8px;background:#0d1118;
  padding:9px 12px;font-size:11.5px;display:flex;gap:10px;align-items:flex-start;
}
.pipe-stage .stage-no{
  flex:0 0 22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;
  background:#151b26;color:var(--neon-cyan);border:1px solid rgba(46,230,255,.3);font-size:10px;
}
.pipe-stage.hit{border-color:rgba(255,84,112,.5);background:rgba(255,84,112,.05)}
.pipe-stage.hit .stage-no{color:var(--neon-red);border-color:rgba(255,84,112,.4)}
.pipe-stage.passed{border-color:rgba(61,255,158,.35)}
.pipe-arrow{align-self:center;color:var(--txt-faint);font-size:12px;padding:1px 0}

/* ---------- CANVAS ---------- */
.canvas-wrap{position:relative;border:1px solid var(--line);border-radius:8px;background:#0a0d13;overflow:hidden}
#node-canvas{display:block;width:100%;height:460px;cursor:crosshair}
.canvas-toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
.node-palette{display:flex;gap:8px;flex-wrap:wrap}
.palette-chip{
  padding:6px 12px;border-radius:8px;font-size:11px;cursor:grab;user-select:none;
  border:1px dashed var(--line);background:#10151d;color:var(--txt-dim);
}
.palette-chip:hover{color:var(--neon-cyan);border-color:var(--neon-cyan)}
.palette-chip.file{border-color:rgba(61,255,158,.4);color:var(--neon-green)}
.palette-chip.dir{border-color:rgba(46,230,255,.4);color:var(--neon-cyan)}
.palette-chip.llm{border-color:rgba(167,139,250,.4);color:var(--neon-violet)}
.hint{font-size:11px;color:var(--txt-faint)}
kbd{background:#161b24;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;font-size:10px}

/* ---------- INSPECTOR ---------- */
.inspector-empty{color:var(--txt-faint);font-size:11px;padding:14px 0;text-align:center}

/* ---------- DOCS ---------- */
.doc h3{color:var(--neon-cyan);font-size:13px;margin:14px 0 6px;letter-spacing:1px}
.doc p,.doc li{color:var(--txt-dim);font-size:12.5px}
.doc ul{margin:6px 0 6px 20px}
.doc code{background:#10151d;border:1px solid var(--line);border-radius:4px;padding:1px 5px;font-size:11.5px;color:var(--neon-green)}
hr.sep{border:none;border-top:1px dashed var(--line);margin:14px 0}
</style>
</head>
<body>

<div id="app-shell">
  <!-- ================= TOP BAR ================= -->
  <header id="topbar">
    <div class="brand">
      <span class="logo-dot"></span>
      <div>
        AGENT&nbsp;WORKBENCH
        <small>FEDORA 44 · ZERO-TRUST BASH COMPILER SUITE</small>
      </div>
    </div>
    <div class="topbar-spacer"></div>
    <span class="pill" id="pill-ws"><span class="dot"></span><span id="ws-status-text">BRIDGE OFFLINE</span></span>
    <span class="pill warn" id="pill-dryrun"><span class="dot"></span><span id="dryrun-status-text">DRY-RUN ARMED</span></span>
    <span class="pill" id="pill-threat"><span class="dot"></span><span id="threat-counter">THREATS BLOCKED: 0</span></span>
    <button class="btn primary" id="btn-connect">CONNECT BRIDGE</button>
  </header>

  <div id="main-grid">
    <!-- ================= SIDEBAR ================= -->
    <nav id="sidebar">
      <div class="nav-section-label">OPERATIONS</div>
      <div class="nav-item active" data-route="canvas"><span class="ico">▦</span>Visual Node Canvas</div>
      <div class="nav-item" data-route="chat"><span class="ico">❯_</span>Live Chat Terminal</div>
      <div class="nav-item" data-route="security"><span class="ico">⛨</span>Security Audit</div>
      <div class="nav-item" data-route="emulation"><span class="ico">☣</span>Attack Emulation</div>
      <div class="nav-section-label">REFERENCE</div>
      <div class="nav-item" data-route="docs"><span class="ico">≡</span>Documentation</div>
      <div class="nav-item" data-route="settings"><span class="ico">⚙</span>Settings</div>
      <div class="sidebar-foot">
        v1.0.3 · single-file build<br/>
        No telemetry · no CDNs · offline-first
      </div>
    </nav>

    <!-- ================= VIEW HOST (SPA router mounts here) ================= -->
    <main id="view-host"></main>
  </div>
</div>

<!-- ======================================================================== -->
<!-- SPA VIEW TEMPLATES (cloned via cloneNode(true) by the router)            -->
<!-- ======================================================================== -->

<template id="visual-node-canvas-view">
  <section class="view" data-view="canvas">
    <div class="glass-panel">
      <div class="panel-title">Visual Graph Compiler · drag nodes · click ports to link · double-click to edit</div>
      <div class="canvas-toolbar">
        <div class="node-palette">
          <span class="palette-chip file" draggable="true" data-type="file_reader">+ file_reader</span>
          <span class="palette-chip dir" draggable="true" data-type="directory_list">+ directory_list</span>
          <span class="palette-chip llm" draggable="true" data-type="ollama_inference">+ ollama_inference</span>
        </div>
        <div class="topbar-spacer"></div>
        <button class="btn" id="btn-autolayout">AUTO-LAYOUT</button>
        <button class="btn danger" id="btn-clear-graph">CLEAR GRAPH</button>
      </div>
      <div class="canvas-wrap">
        <canvas id="node-canvas"></canvas>
      </div>
      <p class="hint" style="margin-top:8px">
        TIP: Drag from a node's right <b>OUT</b> port to another node's left <b>IN</b> port to chain
        <code>$INPUT_DATA_STREAM</code>. The compiler executes nodes in top-to-bottom order. Links are metadata only —
        never raw code.
      </p>
    </div>

    <div class="grid-2">
      <div class="glass-panel">
        <div class="panel-title">Node Inspector / Property Form</div>
        <div id="inspector-slot"><div class="inspector-empty">Select a node on the canvas to edit its parameter payload.</div></div>
        <hr class="sep"/>
        <div class="switch-row">
          <label class="switch"><input type="checkbox" id="chk-dryrun-canvas" checked/><span class="slider"></span></label>
          <span>Defensive Visualizer Mode (halt network · print compiled artifacts)</span>
        </div>
        <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
          <button class="btn primary" id="btn-compile">COMPILE → DRY-RUN</button>
          <button class="btn violet" id="btn-execute">EXECUTE VIA BRIDGE</button>
          <button class="btn" id="btn-copy-script">COPY BASH</button>
        </div>
      </div>
      <div class="glass-panel">
        <div class="panel-title">Workflow JSON Payload (Level 2 artifact)</div>
        <pre class="code-block" id="json-preview">{}</pre>
      </div>
    </div>

    <div class="glass-panel">
      <div class="panel-title">Compiled Bash Artifact (volatile · never written to disk)</div>
      <pre class="code-block" id="bash-preview"># Press COMPILE to generate the bash script string…</pre>
    </div>

    <div class="glass-panel">
      <div class="panel-title">Execution Console</div>
      <div class="console" id="canvas-console"></div>
    </div>
  </section>
</template>

<template id="live-chat-terminal-view">
  <section class="view" data-view="chat">
    <div class="grid-2" style="grid-template-columns:1.4fr 1fr">
      <div class="glass-panel">
        <div class="panel-title">Agent Conversation Channel</div>
        <div class="chat-log" id="chat-log"></div>
        <hr class="sep"/>
        <div style="display:flex;gap:8px">
          <input type="text" id="chat-input" placeholder="Type an instruction… e.g. list my Downloads folder then summarize notes.txt" />
          <button class="btn primary" id="btn-chat-send">SEND</button>
        </div>
        <p class="hint" style="margin-top:8px">Chat directives are compiled into the same zero-trust pipeline as visual graphs. Try an injection attempt — the sanitizer will neutralize it before serialization.</p>
      </div>
      <div class="glass-panel">
        <div class="panel-title">Reactive Router State / Memory Store Snapshot</div>
        <pre class="code-block" id="chat-store-snapshot"></pre>
        <hr class="sep"/>
        <div class="panel-title">Last Compiled Script</div>
        <pre class="code-block" id="chat-last-script" style="max-height:220px"></pre>
      </div>
    </div>
    <div class="glass-panel">
      <div class="panel-title">Bridge stdout/stderr Stream</div>
      <div class="console" id="chat-console" style="height:220px"></div>
    </div>
  </section>
</template>

<template id="security-audit-view">
  <section class="view" data-view="security">
    <div class="kpi-row">
      <div class="kpi green"><div class="k-label">Pipeline Verdict</div><div class="k-value" id="audit-verdict">IDLE</div></div>
      <div class="kpi cyan"><div class="k-label">Payload Size</div><div class="k-value" id="audit-size">0 B</div></div>
      <div class="kpi red"><div class="k-label">Risks Detected</div><div class="k-value" id="audit-risks">0</div></div>
      <div class="kpi amber"><div class="k-label">Threats Blocked (session)</div><div class="k-value" id="audit-blocked">0</div></div>
    </div>

    <div class="glass-panel">
      <div class="panel-title">Zero-Trust Conversion Pipeline (live trace of last compile)</div>
      <div class="pipeline" id="pipeline-trace"></div>
    </div>

    <div class="glass-panel">
      <div class="panel-title">Adversarial Validation Report — Level 3 Gate</div>
      <table class="data">
        <thead><tr><th>Rule ID</th><th>Severity</th><th>Detection Vector</th><th>Status</th></tr></thead>
        <tbody id="audit-table"><tr><td colspan="4" class="hint">No audit executed yet. Compile a workflow from the canvas or run an emulation attack.</td></tr></tbody>
      </table>
    </div>

    <div class="grid-2">
      <div class="glass-panel">
        <div class="panel-title">Defense Registry (behavioral schema)</div>
        <pre class="code-block" id="registry-dump" style="max-height:340px"></pre>
      </div>
      <div class="glass-panel">
        <div class="panel-title">Audit Event Log</div>
        <div class="console" id="audit-console" style="height:340px"></div>
      </div>
    </div>
  </section>
</template>

<template id="attack-emulation-view">

<script>
"use strict";
/* ============================================================================
 * ██ SECTION A — PERSISTENT APP STATE STORE (Task 2.2)
 * Central global memory wrapper. Survives every view swap because the router
 * only clones templates into #view-host; this object is never touched.
 * ==========================================================================*/
const AppStore = {
  connection: {
    endpoint: "ws://localhost:8080",
    socket: null,
    status: "OFFLINE",           // OFFLINE | OPEN | ERROR
    lastError: "",
    reconnectAttempts: 0,
  },
  settings: {
    dryRunMode: true,            // Defensive Visualizer Mode
    defaultModel: "llama3.2",
    maxScriptBytes: 65536,
    strictPaths: true,
    verboseAudit: true,
  },
  graph: {                       // visual node canvas state
    nodes: [],                   // {id,type,x,y,title,properties:{}}
    links: [],                   // {from,to}
    nextId: 1,
    selectedNodeId: null,
    dragging: null,              // {id, offX, offY}
    linking: null,               // {fromId} while dragging a wire
  },
  chat: {
    log: [],                     // {who:'user'|'agent'|'system', text}
  },
  audit: {
    threatsBlocked: 0,
    lastReport: null,            // evaluateScriptSafetyScore() result
    lastTrace: null,             // per-stage pipeline trace
    events: [],                  // rolling event log lines
  },
  runtime: {
    lastCompiledScript: "",
    lastWorkflowJSON: null,
    consoles: {},                // element refs per view console
  },
};

/* ============================================================================
 * ██ SECTION B — MODULE A: SecurityShieldSanitizer (sanitizer core)
 * Level-1 in-browser scrubbing + Level-3 behavioral registry evaluation.
 * ==========================================================================*/
const SecurityShieldSanitizer = {
  /* Raw user text blacklist — anything matching here gets replaced with a
     quarantine marker BEFORE escaping, so it can never survive into code. */
  blacklistTokens: [
    /;\s*rm\s+/gi,
    /&&\s*rm\s+/gi,
    />\s*\/etc/gi,
    /&>\s*\/dev/gi,
    />\s*\/dev/gi,
    /\|\s*(ba)?sh\b/gi,
    /\$\(.*\)/g,
    /`\s*[^`]*`/g,
    /\bnc\s+-e\b/gi,
    /\bncat\s+.*exec/i,
    /\bchown\s+/gi,
    /\bchmod\s+777/gi,
    /\bmkfs\b/gi,
    /\bdd\s+if=/gi,
    /:\(\)\s*\{\s*:\|:&\s*\}/g,       // fork bomb :(){ :|:& };:
    /\bhistory\s+-c\b/gi,
    /\bcrontab\s+-/gi,
    /\bssh-keygen\b/gi,
    /\bbase64\s+-d\b.*\|/gi,
    /\b(eval|exec)\s+/gi,
    /\b(curl\s+[^|]*\||wget\s+[^|]*\|)/gi,
    /\b(ignore|disregard|forget)\s+(all\s+)?(previous|prior|above)\s+instructions?\b/gi,
    /\b(system\s*prompt|you\s+are\s+now|pretend\s+to\s+be|jailbreak|DAN\s+mode)\b/gi,
    /\brm\s+(-[a-z]*\s+)*-?r?f?\s*\/(\s|$)/gi,
  ],

  /* Prompt-injection keyword gate (used on free-text fields like chat). */
  jailbreakPatterns: [
    /ignore\s+(all\s+)?previous\s+instructions/i,
    /disregard\s+(the\s+)?(system|rules|policy)/i,
    /reveal\s+(your\s+)?(system\s+)?prompt/i,
    /you\s+are\s+(now|no\s+longer)\s/i,
    /act\s+as\s+(root|admin|unrestricted)/i,
    /jailbreak|\bDAN\b|developer\s+mode/i,
    /exfiltrate|backdoor|reverse\s+shell/i,
  ],

  /**
   * Sanitizes incoming prompt lines to neutralize variable extraction bugs.
   * @param {string} inputString Raw alphanumeric user parameter input
   * @returns {string} Fully isolated, shell-safe string character array
   */
  sanitizeShellString(inputString) {
    if (typeof inputString !== "string") return "";
    let processedText = inputString.replace(/[\x00-\x08\x0b\x0c\x0e-\x1f\x7f]/g, "").trim();

    // 1. Neutralize dangerous semantic patterns FIRST (before escaping turns
    //    them invisible to the detectors).
    for (const tokenPattern of this.blacklistTokens) {
      tokenPattern.lastIndex = 0;
      if (tokenPattern.test(processedText)) {
        console.warn(`[SECURITY ALERT] Dangerous system input block pattern identified and neutralized: ${tokenPattern}`);
        processedText = processedText.replace(tokenPattern, "#[BLOCKED_INJECTION_ATTEMPT]");
        AppStore.audit.threatsBlocked++;
        UI.refreshTopbarPills();
      }
    }

    // 2. Escape critical shell control meta-characters cleanly.
    processedText = processedText
      .replace(/\\/g, "\\\\")
      .replace(/`/g, "\\`")
      .replace(/\$/g, "\\$")
      .replace(/"/g, '\\"');

    // 3. Final belt-and-braces pass: neutralize stray semicolons that could
    //    split statements inside double-quoted assignments (entity-encoded so
    //    the value stays inert data).
    processedText = processedText.replace(/;/g, "&#59;");

    return processedText;
  },

  /**
   * Path-policy view for detectors: undo ONLY the deterministic sanitizer
   * artifacts (&#59; → ; and \\x → x) to reveal what a hostile value was
   * originally attempting, then test it against the system-path policy.
   */
  isPathFieldHostile(sanitizedValue) {
    const revived = String(sanitizedValue || "").replace(/&#59;/g, ";").replace(/\\(.)/g, "$1");
    return !this.isPathSafe(revived);
  },

  /** Detect jailbreak phrasing without mutating the text. */
  isPromptInjection(text) {
    if (typeof text !== "string") return false;
    return this.jailbreakPatterns.some((p) => { p.lastIndex = 0; return p.test(text); });
  },

  /** Path policy validator: reject device files, root traversal, dot-smuggling. */
  isPathSafe(rawPath) {
    if (typeof rawPath !== "string" || rawPath.length === 0) return false;
    const p = rawPath.trim();
    if (/^(\/|\/bin|\/sbin|\/boot|\/dev|\/proc|\/sys|\/usr|\/var\/lib|\/etc)(\/|$)/.test(p)) return false;
    if (/passwd|shadow|authorized_keys|\/\.ssh|\/\.gnupg|id_rsa/i.test(p)) return false;
    if (/\.\./.test(p)) return false;
    return true;
  },

  /* ------------------------------------------------------------------
   * Level-3 gate: scan the COMPLETED bash string for residual injection
   * residue that must never have been produced by the compiler itself.
   * @returns {{isPassed:boolean, score:number, identifiedRisks:Array}}
   * ------------------------------------------------------------------*/
  evaluateScriptSafetyScore(compiledScriptText) {
    const report = { isPassed: true, score: 100, identifiedRisks: [] };
    const risks = report.identifiedRisks;
    const hit = (msg, weight = 25) => { risks.push(msg); report.score = Math.max(0, report.score - weight); };

    if (typeof compiledScriptText !== "string" || compiledScriptText.length === 0) {
      hit("Empty script buffer received by validation gate.", 100);
    } else {
      if (!compiledScriptText.startsWith("#!/bin/bash")) {
        hit("Missing authoritative Bash execution signature header path.");
      }
      // Forbidden binaries / exfiltration utilities anywhere in the body.
      const forbidden = [
        [/\bsudo\b/, "Privileged access escalation token (sudo) identified inside script block layout."],
        [/\bsu\s+-/, "Switch-user invocation detected."],
        [/\bnc\s+/, "Netcat (nc) network hook detected."],
        [/\bncat\b/, "Ncat network hook detected."],
        [/\btelnet\b/, "Telnet network hook detected."],
        [/\bcurl\b/, "cURL remote fetch utility detected."],
        [/\bwget\b/, "WGET remote fetch utility detected."],
        [/--decrypt/, "Credential decryption routine detected."],
        [/\/etc\/(passwd|shadow)/, "Credential store path referenced."],
        [/\/dev\/(tcp|udp)\//, "Bash pseudo-device reverse-shell channel detected."],
        [/\bkill\s+-9\b/, "Process termination weapon detected."],
        [/\bcrontab\b/, "Persistence scheduler manipulation detected."],
        [/\bhistory\s+-c\b/, "Audit-trail destruction detected."],
        [/\bchmod\s+777\b/, "World-writable permission grant detected."],
        [/\bchown\b/, "Ownership transfer detected."],
        [/\bmkfs\b|\bdd\s+if=/, "Raw disk mutation detected."],
        [/\beval\s/, "Dynamic eval() execution surface detected."],
        [/\|\s*(ba)?sh\b/, "Pipe-to-shell execution chain detected."],
        [/&&\s*(rm|dd|mkfs|nc|curl|wget)\b/, "Chained destructive operator detected."],
        [/`[^`]*`/, "Backtick command substitution detected."],
        [/rm\s+(-[a-zA-Z]*[rf][a-zA-Z]*\s+)+\/(\s|$)/, "Recursive deletion targeting filesystem root detected.", 100],
      ];
      for (const [pattern, message] of forbidden) {
        // Test against comment-stripped copy so generated comments (# ...) don't
        // trip detectors that legitimately mention the words.
        const stripped = compiledScriptText
          .split("\n")
          .map((l) => l.replace(/^\s*#.*$/, ""))
          .join("\n");
        pattern.lastIndex = 0;
        if (pattern.test(stripped)) hit(message, pattern.source.includes("root") ? 100 : 25);
      }
      // Command-substitution detector runs on a copy where the two KNOWN
      // compiler-emitted assignments are whitelisted back in — any other
      // $( ) construction is hostile residue and gets flagged.
      let substProbe = compiledScriptText
        .split("\n")
        .map((l) => l.replace(/^\s*#.*$/, ""))
        .join("\n")
        .replace(/OUTPUT_DATA_BUFFER=\$\(/g, "")
        .replace(/INPUT_DATA_STREAM=\$\(/g, "")
        .replace(/\)\s*$/gm, "");
      if (/\$\([^)]*\)/.test(substProbe)) hit("Command substitution $( ) detected.");
      // Statement-splitting semicolon detector: scans only OUTSIDE double-quoted
      // literal regions AND outside the compiler's own control-flow statement
      // prefixes (sanitized values entity-encode their ';' as &#59;, so any raw
      // semicolon surviving in expression position is hostile residue).
      const CONTROL_FLOW = /^\s*(?:if\s|elif\s|then\b|else\b|fi\b|for\s|while\s|do\b|done\b|case\s|esac\b|\}|set\s)/;
      const semiLines = compiledScriptText.split("\n").filter((l) => !CONTROL_FLOW.test(l));
      const outQ = semiLines.map((l) => l.replace(/^\s*#.*$/, "").replace(/"[^"]*"/g, '""')).join("\n");
      if (/;/.test(outQ)) hit("Illegal statement-splitting semicolon outside quoted literals detected.", 30);
      // Heredoc policy: only the compiler's own WORKBENCH_EOF delimiter is legal.
      const hd = compiledScriptText.match(/<<-?\s*['"]?([A-Za-z_][\w]*)/g) || [];
      for (const d of hd) {
        if (!d.includes("WORKBENCH_EOF")) { hit("Foreign Here-Document delimiter outside compiler whitelist detected."); }
      }
      // Structural requirements.
      if (!/set\s+-e/.test(compiledScriptText)) hit("Compiler fault: 'set -e' error-halt guard missing.");
      if (!/set\s+-o\s+pipefail/.test(compiledScriptText)) hit("Compiler fault: 'pipefail' option missing.");
      if (compiledScriptText.length > AppStore.settings.maxScriptBytes) hit("Script exceeds configured maximum byte budget.", 100);
    }

    report.isPassed = risks.length === 0;
    return report;
  },
};

/* ============================================================================
 * ██ SECTION C — MODULE B: CoreTaskCodeRegistry + Compiler (Task 1)
 * Declarative task mapping registry: node type -> bash segment generator.
 * ==========================================================================*/
const CoreTaskCodeRegistry = {
  /* ------------------------------------------------------------------
   * Dynamic File System Validation Node Handler Block
   * Properties payload carries the targeted file path configuration.
   * -----------------------------------------------------------------*/
  file_reader: {
    title: "File Ingestion Node",
    icon: "🗎",
    accent: "#3dff9e",
    defaults: { path: "~/notes.txt" },
    fields: [{ key: "path", label: "Target File Path", placeholder: "~/projects/data/notes.txt" }],
    generateBashSegment(nodeProperties) {
      const safePath = SecurityShieldSanitizer.sanitizeShellString(nodeProperties.path || "./notes.txt");
      return `
# ---------------------------------------------------------------
# VISUAL FLOW NODE ROUTINE: [File Ingestion Engine]
# ---------------------------------------------------------------
TARGET_FILE_CONTEXT="${safePath}"
echo "[GUI_RUNTIME] Accessing storage directory location: $TARGET_FILE_CONTEXT"
if [[ -f "$TARGET_FILE_CONTEXT" ]]; then
  if [[ -r "$TARGET_FILE_CONTEXT" ]]; then
    INPUT_DATA_STREAM=$(cat "$TARGET_FILE_CONTEXT")
    echo "[GUI_RUNTIME] Read operations successful. Context byte size: \${#INPUT_DATA_STREAM} octets."
  else
    echo "[SHELL_FATAL] Operational access denied: File permissions block read routines." >&2
    exit 1
  fi
else
  echo "[SHELL_FATAL] Storage directory trace mapping lost: $TARGET_FILE_CONTEXT missing." >&2
  exit 1
fi
`.trim() + "\n";
    },
  },

  /* ------------------------------------------------------------------
   * Local AI Gateway Pipeline Node Configuration Handler Block
   * Directs structured variables into the Ollama inference server.
   * Heredoc isolation guarantees prompt text can never be executed.
   * -----------------------------------------------------------------*/
  ollama_inference: {
    title: "Ollama Model Pipeline Node",
    icon: "🧠",
    accent: "#a78bfa",
    defaults: { model: "llama3.2", systemInstructions: "Summarize the data stream provided." },
    fields: [
      { key: "model", label: "Model Identifier", placeholder: "llama3.2" },
      { key: "systemInstructions", label: "System Instructions (prompt)", placeholder: "Summarize data streams input.", multiline: true },
    ],
    generateBashSegment(nodeProperties) {
      const targetModel = SecurityShieldSanitizer.sanitizeShellString(nodeProperties.model || "llama3.2");
      const sanitizedPrompt = SecurityShieldSanitizer.sanitizeShellString(
        nodeProperties.systemInstructions || "Summarize data streams input."
      );
      // NOTE: the heredoc delimiter below is intentionally UNQUOTED so bash
      // expands $INPUT_DATA_STREAM at runtime; every user-supplied value is
      // already escaped ($ \` ") by the sanitizer, and the Level-3 gate
      // re-scans the finished artifact before any transmission.
      return `
# ---------------------------------------------------------------
# VISUAL FLOW NODE ROUTINE: [Ollama Model Framework Inference]
# ---------------------------------------------------------------
OLLAMA_TARGET_MODEL="${targetModel}"
OLLAMA_SYSTEM_INSTRUCTION="${sanitizedPrompt}"
echo "[GUI_RUNTIME] Initializing inference pipeline utilizing model context: $OLLAMA_TARGET_MODEL"

# Masked-variable + Here-Document ingestion loop: prompt/instruction values
# travel only as quoted variable data — never as executable statement text.
OUTPUT_DATA_BUFFER=$(ollama run "$OLLAMA_TARGET_MODEL" --system "$OLLAMA_SYSTEM_INSTRUCTION" <<WORKBENCH_EOF
$INPUT_DATA_STREAM
WORKBENCH_EOF
)
if [[ $? -eq 0 ]]; then
  echo "[GUI_RUNTIME] Model execution completed successfully."
  echo "--- OUTPUT LOG SPLIT ---"
  echo "$OUTPUT_DATA_BUFFER"
  echo "--- OUTPUT LOG SPLIT ---"
  INPUT_DATA_STREAM="$OUTPUT_DATA_BUFFER"
else
  echo "[SHELL_FATAL] Local inference invocation process loop failure (is ollama serving?)." >&2
  exit 1
fi
`.trim() + "\n";
    },
  },

  /* ------------------------------------------------------------------
   * Directory Diagnostic Scanning Module Handler Block
   * Maps hardware directory storage parameters to native ls summaries.
   * -----------------------------------------------------------------*/
  directory_list: {
    title: "Directory Diagnostics Scanner Node",
    icon: "🗂",
    accent: "#2ee6ff",
    defaults: { directoryRoute: "~" },
    fields: [{ key: "directoryRoute", label: "Directory Route", placeholder: "~/Downloads" }],
    generateBashSegment(nodeProperties) {
      const targetFolder = SecurityShieldSanitizer.sanitizeShellString(nodeProperties.directoryRoute || ".");
      return `
# ---------------------------------------------------------------
# VISUAL FLOW NODE ROUTINE: [Directory Diagnostics Scan Component]
# ---------------------------------------------------------------
TARGET_SCAN_ROUTE="${targetFolder}"
echo "[GUI_RUNTIME] Initiating diagnostics directory scan on route: $TARGET_SCAN_ROUTE"
if [[ -d "$TARGET_SCAN_ROUTE" ]]; then
  ls -la --color=always --group-directories-first "$TARGET_SCAN_ROUTE"
  INPUT_DATA_STREAM=$(ls -la --color=never --group-directories-first "$TARGET_SCAN_ROUTE")
  echo "[GUI_RUNTIME] Directory inventory captured into stream buffer."
else
  echo "[SHELL_FATAL] Target filesystem path route missing or inaccessible: $TARGET_SCAN_ROUTE" >&2
  exit 1
fi
`.trim() + "\n";
    },
  },
};

/**
 * Task 1.1 — Dynamic Form Fields → JSON Array Workflow Node Builder.
 * Collects the live canvas graph + global settings and formats them into a
 * sequential, structured, immutable JSON dataset (metadata ONLY — zero raw
 * executable code crosses this boundary).
 */
function buildWorkflowJSON() {
  const g = AppStore.graph;
  const orderedNodes = [...g.nodes].sort((a, b) => a.y - b.y || a.x - b.x);
  const payload = {
    schema: "workbench.workflow/v1",
    meta: {
      generatedAt: new Date().toISOString(),
      origin: "browser-gui",
      targetHost: "fedora-44-kde",
      transport: "ws://localhost:8080",
      executionMode: AppStore.settings.dryRunMode ? "DEFENSIVE_DRY_RUN" : "BRIDGE_EXECUTE",
    },
    nodes: orderedNodes.map((n, i) => ({
      step: i + 1,
      id: n.id,
      type: n.type,
      title: CoreTaskCodeRegistry[n.type] ? CoreTaskCodeRegistry[n.type].title : n.title,
      properties: (() => {
        const clean = {};
        for (const [k, v] of Object.entries(n.properties || {})) {
          clean[k] = typeof v === "string" ? SecurityShieldSanitizer.sanitizeShellString(v) : String(v);
        }
        return clean;
      })(),
    })),
    links: g.links.map((l) => ({ from: l.from, to: l.to, carries: "$INPUT_DATA_STREAM" })),
  };
  return payload;
}

/**
 * Task 1.2 — The Secure Script Serializer compileWorkflowToBash(workflowJSON).
 * Maps the configuration payload into a valid multi-line Bash script string
 * starting with the authoritative #!/bin/bash signature header.
 */
function compileWorkflowToBash(workflowJSON) {
  if (!workflowJSON || !Array.isArray(workflowJSON.nodes)) {
    throw new Error("Invalid payload exception: Graphic workspace nodes map missing from translation structure.");
  }
  let compiledScriptBuffer = "#!/bin/bash\n";
  compiledScriptBuffer += "# =========================================================================\n";
  compiledScriptBuffer += "# AUTOMATICALLY COMPILED BASH SCRIPT FROM VISUAL FRONTEND AGENT GUI\n";
  compiledScriptBuffer += "# TARGET UTILITY EXECUTOR PIPELINE: FEDORA 44 STANDARD INTERPRETER\n";
  compiledScriptBuffer += `# GENERATED: ${workflowJSON.meta ? workflowJSON.meta.generatedAt : new Date().toISOString()}\n`;
  compiledScriptBuffer += `# MODE: ${workflowJSON.meta ? workflowJSON.meta.executionMode : "UNKNOWN"}\n`;
  compiledScriptBuffer += "# =========================================================================\n\n";

  // Persistent internal error validation tracking state inside the script body.
  compiledScriptBuffer += "set -e\nset -o pipefail\n\n";
  compiledScriptBuffer += 'INPUT_DATA_STREAM=""\n';
  compiledScriptBuffer += 'OUTPUT_DATA_BUFFER=""\n\n';

  for (const executionNode of workflowJSON.nodes) {
    const structuralModule = CoreTaskCodeRegistry[executionNode.type];
    if (structuralModule) {
      compiledScriptBuffer += structuralModule.generateBashSegment(executionNode.properties || {});
      compiledScriptBuffer += "\n";
    } else {
      compiledScriptBuffer += `\n# [COMPILER_WARNING] Unknown workflow block node identifier bypassed: ${String(executionNode.type).replace(/[^\w-]/g, "_")}\n\n`;
    }
  }

  compiledScriptBuffer += '\necho "[GUI_RUNTIME] Execution lifecycle successfully finalized. Exiting subshell ring."\n';
  compiledScriptBuffer += "exit 0\n";
  return compiledScriptBuffer;
}

/* ============================================================================
 * ██ SECTION D — WEBSOCKET TRANSPORT LAYER (Phase 4 client side)
 * ==========================================================================*/
const BridgeTransport = {
  connect() {
    if (AppStore.connection.socket && AppStore.connection.socket.readyState <= 1) return;
    UI.logAll("net", `[NET] Dialing bridge endpoint ${AppStore.connection.endpoint} …`);
    try {
      const ws = new WebSocket(AppStore.connection.endpoint);
      AppStore.connection.socket = ws;
      ws.onopen = () => {
        AppStore.connection.status = "OPEN";
        AppStore.connection.reconnectAttempts = 0;
        UI.refreshTopbarPills();
        UI.logAll("ok", "[NET] Handshake complete — bridge daemon online. Framed protocol EXECUTE_BASH_STRING ready.");
      };
      ws.onmessage = (evt) => BridgeTransport.handleFrame(evt.data);
      ws.onerror = () => {
        AppStore.connection.status = "ERROR";
        AppStore.connection.lastError = "Socket error (is bridge_daemon.py running?)";
        UI.refreshTopbarPills();
        UI.logAll("err", "[NET] Transport error: " + AppStore.connection.lastError);
      };
      ws.onclose = () => {
        AppStore.connection.status = "OFFLINE";
        AppStore.connection.socket = null;
        UI.refreshTopbarPills();
        UI.logAll("sys", "[NET] Bridge closed. Auto-retry suppressed — press CONNECT BRIDGE to redial.");
      };
    } catch (e) {
      AppStore.connection.status = "ERROR";
      AppStore.connection.lastError = String(e);
      UI.refreshTopbarPills();
    }
  },

  /** Send one validated EXECUTE_BASH_STRING frame. */
  sendExecute(scriptText, report) {
    const ws = AppStore.connection.socket;
    if (!ws || ws.readyState !== 1) {
      UI.logAll("err", "[NET] Cannot transmit: bridge offline. Run `python3 bridge_daemon.py` on the Fedora host and press CONNECT BRIDGE.");
      return false;
    }
    const frame = JSON.stringify({
      type: "EXECUTE_BASH_STRING",
      token: "workbench-local-session",
      payload: {
        script: scriptText,
        sha256ish: BridgeTransport.quickHash(scriptText),
        bytes: new TextEncoder().encode(scriptText).length,
        clientVerdict: report.isPassed ? "PASS" : "FAIL",
        riskCount: report.identifiedRisks.length,
      },
    });
    ws.send(frame);
    UI.logAll("net", `[NET] Frame dispatched (${frame.length} bytes) → awaiting daemon Level-4 verdict…`);
    return true;
  },

  /** Daemon pushes {type:STDOUT|STDERR|EXIT|RESULT|LOG, ...} frames. */
  handleFrame(raw) {
    let f;
    try { f = JSON.parse(raw); } catch { UI.logAll("err", "[NET] Malformed daemon frame ignored."); return; }
    switch (f.type) {
      case "STDOUT": UI.logAll("out", String(f.line)); break;
      case "STDERR": UI.logAll("err", String(f.line)); break;
      case "EXIT":   UI.logAll(f.code === 0 ? "ok" : "err", `[RUN] Process exited with code ${f.code}`); break;
      case "RESULT": UI.logAll("ok", `[DAEMON] ${f.message}`); break;
      case "LOG":    UI.logAll("sys", `[DAEMON] ${f.message}`); break;
      default:       UI.logAll("sys", `[DAEMON] uncatalogued frame type: ${String(f.type).slice(0, 40)}`);
    }
  },

  quickHash(str) {
    let h = 0x811c9dc5;
    for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 0x0100011f) >>> 0; }
    return ("0000000" + h.toString(16)).slice(-8);
  },
};

/* ============================================================================
 * ██ SECTION E — ORCHESTRATOR: full Phase 1→4 pipeline with Level-3 gate
 * ==========================================================================*/
const PipelineOrchestrator = {
  /**
   * Runs the entire DevSecOps conversion pipeline for the current graph.
   * @param {boolean} wantExecute true = EXECUTE button, false = COMPILE button
   */
  run(wantExecute) {
    const trace = [];
    const t0 = performance.now();

    // Internal safety re-audit: if the CURRENTLY stored compiled artifact is
    // unsafe, purge it immediately so no view can display/transmit stale risk.
    const purgeIfUnsafe = () => {
      if (AppStore.runtime.lastCompiledScript &&
          !SecurityShieldSanitizer.evaluateScriptSafetyScore(AppStore.runtime.lastCompiledScript).isPassed) {
        AppStore.runtime.lastCompiledScript = "";
        AppStore.runtime.lastWorkflowJSON = null;
      }
    };

    /* ---- LEVEL 1 + 2: build sanitized JSON payload ---- */
    const wf = buildWorkflowJSON();
    if (wf.nodes.length === 0) {
      purgeIfUnsafe();
      trace.push({ stage: "L1/L2 · Formulation", status: "hit", note: "Empty graph — nothing to compile. Add nodes from the palette first." });
      AppStore.audit.lastTrace = trace;
      UI.refreshAuditPanels(); UI.refreshCanvasArtifacts();
      return null;
    }
    AppStore.runtime.lastWorkflowJSON = wf;
    trace.push({ stage: "L1 · Native In-Browser Input Sanitization", status: "passed", note: `${wf.nodes.length} node(s) scrubbed · escape sequences neutralized` });
    trace.push({ stage: "L2 · Structured JSON Serialization", status: "passed", note: `schema ${wf.schema} · ${JSON.stringify(wf).length} B metadata frame (zero raw code)` });

    /* ---- COMPILE ---- */
    let script = "";
    try { script = compileWorkflowToBash(wf); }
    catch (e) { trace.push({ stage: "COMPILER", status: "hit", note: e.message }); this.finish(trace, null, t0); return null; }
    AppStore.runtime.lastCompiledScript = script;

    /* ---- LEVEL 3: adversarial validation & dry-run assessment ---- */
    const report = SecurityShieldSanitizer.evaluateScriptSafetyScore(script);
    trace.push({
      stage: "L3 · Adversarial Validation Check & Dry-Run",
      status: report.isPassed ? "passed" : "hit",
      note: report.isPassed
        ? `PASS · safety score ${report.score}/100 · no residual injection vectors`
        : `HALT · score ${report.score}/100 · ${report.identifiedRisks.length} risk(s) — see audit table`,
    });
    AppStore.audit.lastReport = report;

    if (!report.isPassed) {
      AppStore.audit.threatsBlocked++;
      AppStore.runtime.lastCompiledScript = "";   // quarantine: never keep a failed artifact in memory
      trace.push({ stage: "NETWORK GATE", status: "hit", note: "Transmission aborted locally. Script never left the browser sandbox." });
      this.finish(trace, report, t0);
      UI.logAll("sec", `[SHIELD] Level-3 gate SHUT DOWN transmission: ${report.identifiedRisks[0]}`);
      return report;
    }

    /* ---- LEVEL 4/5 decision: dry-run vs live WebSocket ---- */
    if (AppStore.settings.dryRunMode) {
      trace.push({ stage: "L4 · Daemon Payload Check", status: "skipped", note: "DEFENSIVE VISUALIZER MODE armed — network halted, artifacts printed to inspection panels." });
      trace.push({ stage: "L5 · Volatile Shell Ingestion", status: "skipped", note: "No bytes entered /bin/bash. Review the compiled artifact above, then disarm dry-run to execute." });
      UI.logAll("warn", "[DRY-RUN] Defensive Visualizer Mode halted transmission. JSON tree + Bash artifact printed in inspection panels.");
    } else {
      trace.push({ stage: "L4 · Daemon Payload Check", status: "pending", note: "Frame in flight — daemon re-validates schema, types, size and path policy independently." });
      trace.push({ stage: "L5 · Volatile Shell Ingestion", status: "pending", note: "Daemon pipes script into /bin/bash via stdin. Zero .sh files touch Fedora storage." });
      if (wantExecute) BridgeTransport.sendExecute(script, report);
    }

    this.finish(trace, report, t0);
    return report;
  },

  finish(trace, report, t0) {
    AppStore.audit.lastTrace = trace;
    AppStore.audit.lastMs = Math.round(performance.now() - t0);
    UI.refreshAuditPanels();
    UI.refreshCanvasArtifacts();
  },

  /**
   * Task 4.1 — Adversarial verification of an arbitrary hostile payload:
   * pushes it through L1→L2→L3 and returns the interception trace.
   */
  emulateAttack(rawPayload, label) {
    const trace = [];
    const caughtStages = [];

    // Stage 1: input scrubbing
    const injectionFlag = SecurityShieldSanitizer.isPromptInjection(rawPayload);
    const cleaned = SecurityShieldSanitizer.sanitizeShellString(rawPayload);
    const mutated = cleaned !== rawPayload.trim().replace(/[\x00-\x1f]/g, "");
    if (injectionFlag || mutated) {
      AppStore.audit.threatsBlocked++;
      caughtStages.push("L1");
      trace.push({ stage: "L1 · Input Scrubbing", status: "hit", note: `${label}: ${injectionFlag ? "prompt-injection grammar flagged" : "control/meta-character payload rewritten"} → quarantined as “${cleaned.slice(0, 60)}”` });
    } else {
      trace.push({ stage: "L1 · Input Scrubbing", status: "passed", note: "No blacklist token matched (payload may still fail deeper gates)." });
    }

    // Stage 2: serialization containment — attacker text becomes inert string data only
    const fakeWF = {
      schema: "workbench.workflow/v1",
      meta: { generatedAt: new Date().toISOString(), origin: "emulation-console", executionMode: "SIMULATED" },
      nodes: [{ step: 1, id: "emu-1", type: "file_reader", title: "EMULATION PROBE", properties: { path: cleaned } }],
      links: [],
    };
    trace.push({ stage: "L2 · JSON Containment", status: "passed", note: "Payload confined to a quoted static property field — structurally incapable of becoming a statement." });

    // Stage 3: compiled-artifact scan
    const script = compileWorkflowToBash(fakeWF);
    const report = SecurityShieldSanitizer.evaluateScriptSafetyScore(script);
    const pathHostile = SecurityShieldSanitizer.isPathFieldHostile(cleaned);
    if (!report.isPassed) {
      AppStore.audit.threatsBlocked++;
      caughtStages.push("L3");
      trace.push({ stage: "L3 · Compiled-Artifact Scan", status: "hit", note: "Residual vector survived scrubbing → " + report.identifiedRisks.join(" ") });
    } else if (pathHostile && AppStore.settings.strictPaths) {
      AppStore.audit.threatsBlocked++;
      caughtStages.push("L3-PATH");
      trace.push({ stage: "L3 · Strict Path Policy", status: "hit", note: "Target resolves to protected system territory (/etc,/dev,/proc, traversal '..') or root paths → operation refused." });
    } else {
      trace.push({ stage: "L3 · Compiled-Artifact Scan", status: "passed", note: "Artifact clean; would proceed to network gate." });
    }

    // Stage 4/5: never reached in emulation mode — explicit local firewall note
    trace.push({ stage: "L4/L5 · Network + Shell Ring", status: "blocked", note: caughtStages.length
      ? `INTERCEPTED upstream at ${caughtStages.join(" + ")}. Zero bytes transmitted. Fedora host untouched.`
      : "Simulated stop — emulation console never opens a real socket. Benign control payload verified end-to-end." });

    AppStore.audit.lastTrace = trace;
    AppStore.audit.lastReport = report;
    UI.renderEmulationTrace(trace, caughtStages, label, rawPayload, cleaned);
    UI.refreshTopbarPills();
    UI.logAll("sec", `[EMULATION] "${label}" → ${caughtStages.length ? "BLOCKED at " + caughtStages.join("+") : "PASSED (benign control)"}`);
    return { trace, caughtStages, report };
  },
};

/* ============================================================================
 * ██ SECTION F — SPA ROUTING ENGINE (Task 2.1)
 * Template swapper using native cloneNode(true); AppStore survives swaps.
 * ==========================================================================*/
const Router = {
  routes: {
    canvas:     "visual-node-canvas-view",
    chat:       "live-chat-terminal-view",
    security:   "security-audit-view",
    emulation:  "attack-emulation-view",
    docs:       "documentation-view",
    settings:   "settings-view",
  },
  current: null,

  navigate(routeKey) {
    const tplId = this.routes[routeKey];
    if (!tplId) return;
    const template = document.getElementById(tplId);
    if (!template) return;

    // Tear down old view DOM (state lives in AppStore, NOT in the DOM).
    const host = document.getElementById("view-host");
    host.innerHTML = "";

    // Performance-driven template swapper: deep-clone the native template.
    const fragment = template.content.cloneNode(true);
    host.appendChild(fragment);

    this.current = routeKey;
    document.querySelectorAll(".nav-item").forEach((el) =>
      el.classList.toggle("active", el.dataset.route === routeKey));

    ViewBindings.bind(routeKey);            // wire controls for the fresh DOM
    UI.refreshTopbarPills();
    UI.refreshCanvasArtifacts();
    UI.refreshAuditPanels();
    UI.refreshChatView();
    UI.syncSettingsView();
    if (routeKey === "canvas") CanvasRenderer.resizeAndRedraw();
    history.replaceState(null, "", "#" + routeKey);
  },

  init() {
    document.querySelectorAll(".nav-item").forEach((el) =>
      el.addEventListener("click", () => this.navigate(el.dataset.route)));
    const hash = (location.hash || "#canvas").slice(1);
    this.navigate(this.routes[hash] ? hash : "canvas");
  },
};

/* ============================================================================
 * ██ SECTION G — CANVAS RENDERER (litegraph-style visual engine, vanilla)
 * ==========================================================================*/
const CanvasRenderer = {
  cv: null, ctx: null, dpr: 1,

  attach() {
    this.cv = document.getElementById("node-canvas");
    if (!this.cv) return;
    this.ctx = this.cv.getContext("2d");
    this.resizeAndRedraw();
    this.cv.addEventListener("mousedown", (e) => this.onDown(e));
    this.cv.addEventListener("mousemove", (e) => this.onMove(e));
    this.cv.addEventListener("mouseup",   (e) => this.onUp(e));
    this.cv.addEventListener("dblclick",  (e) => this.onDblClick(e));
    this.cv.addEventListener("dragover",  (e) => e.preventDefault());
    this.cv.addEventListener("drop",      (e) => this.onDrop(e));
    window.addEventListener("resize", () => { if (Router.current === "canvas") this.resizeAndRedraw(); });
  },

  resizeAndRedraw() {
    if (!this.cv) return;
    const r = this.cv.getBoundingClientRect();
    this.dpr = window.devicePixelRatio || 1;
    this.cv.width = Math.max(300, r.width * this.dpr);
    this.cv.height = Math.max(200, r.height * this.dpr);
    this.draw();
  },

  pt(e) {
    const r = this.cv.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  },

  nodeAt(p) {
    const g = AppStore.graph;
    for (let i = g.nodes.length - 1; i >= 0; i--) {
      const n = g.nodes[i];
      if (p.x >= n.x && p.x <= n.x + NODE_W && p.y >= n.y && p.y <= n.y + NODE_H) return n;
    }
    return null;
  },

  portAt(p) {
    const g = AppStore.graph;
    for (const n of g.nodes) {
      const out = { x: n.x + NODE_W, y: n.y + NODE_H / 2 };
      const inn = { x: n.x, y: n.y + NODE_H / 2 };
      if (Math.hypot(p.x - out.x, p.y - out.y) < 10) return { kind: "out", node: n };
      if (Math.hypot(p.x - inn.x, p.y - inn.y) < 10) return { kind: "in", node: n };
    }
    return null;
  },

  onDown(e) {
    const p = this.pt(e);
    const port = this.portAt(p);
    if (port && port.kind === "out") { AppStore.graph.linking = { fromId: port.node.id }; return; }
    const n = this.nodeAt(p);
    if (n) {
      AppStore.graph.selectedNodeId = n.id;
      AppStore.graph.dragging = { id: n.id, offX: p.x - n.x, offY: p.y - n.y };
      UI.renderInspector();
    } else {
      AppStore.graph.selectedNodeId = null;
      UI.renderInspector();
    }
    this.draw();
  },

  onMove(e) {
    const p = this.pt(e);
    const g = AppStore.graph;
    if (g.dragging) {
      const n = g.nodes.find((x) => x.id === g.dragging.id);
      if (n) { n.x = Math.max(4, p.x - g.dragging.offX); n.y = Math.max(4, p.y - g.dragging.offY); }
      this.draw();
    } else if (g.linking) {
      this.draw(p);
    } else {
      const hover = this.portAt(p) || this.nodeAt(p);
      this.cv.style.cursor = hover ? "pointer" : "crosshair";
    }
  },

  onUp(e) {
    const g = AppStore.graph;
    if (g.linking) {
      const p = this.pt(e);
      const port = this.portAt(p);
      if (port && port.kind === "in" && port.node.id !== g.linking.fromId) {
        const exists = g.links.some((l) => l.from === g.linking.fromId && l.to === port.node.id);
        if (!exists) g.links.push({ from: g.linking.fromId, to: port.node.id });
      }
      g.linking = null;
    }
    g.dragging = null;
    this.draw();
    UI.refreshCanvasArtifacts();
  },

  onDblClick(e) {
    const n = this.nodeAt(this.pt(e));
    if (n) {
      AppStore.graph.selectedNodeId = n.id;
      UI.renderInspector(true);
      this.draw();
    }
  },

  onDrop(e) {
    e.preventDefault();
    const type = e.dataTransfer.getData("text/plain");
    if (!CoreTaskCodeRegistry[type]) return;
    const p = this.pt(e);
    this.addNode(type, Math.max(4, p.x - NODE_W / 2), Math.max(4, p.y - 20));
  },

  addNode(type, x, y) {
    const def = CoreTaskCodeRegistry[type];
    if (!def) return;
    const node = {
      id: "n" + AppStore.graph.nextId++,
      type,
      x: x ?? 40 + (AppStore.graph.nodes.length % 3) * 240,
      y: y ?? 30 + Math.floor(AppStore.graph.nodes.length / 3) * 130,
      title: def.title,
      properties: JSON.parse(JSON.stringify(def.defaults)),
    };
    AppStore.graph.nodes.push(node);
    AppStore.graph.selectedNodeId = node.id;
    UI.renderInspector();
    this.draw();
    UI.refreshCanvasArtifacts();
    UI.logAll("sys", `[GRAPH] Added ${def.title} (${node.id})`);
  },

  autolayout() {
    const g = AppStore.graph;
    g.nodes.sort((a, b) => a.y - b.y || a.x - b.x);
    g.nodes.forEach((n, i) => { n.x = 30 + (i % 3) * 250; n.y = 24 + Math.floor(i / 3) * 130; });
    this.draw();
  },

  clear() {
    AppStore.graph.nodes = [];
    AppStore.graph.links = [];
    AppStore.graph.selectedNodeId = null;
    UI.renderInspector();
    this.draw();
    UI.refreshCanvasArtifacts();
  },

  draw(mousePos) {
    if (!this.ctx) return;
    const ctx = this.ctx, dpr = this.dpr, g = AppStore.graph;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const W = this.cv.width / dpr, H = this.cv.height / dpr;
    ctx.clearRect(0, 0, W, H);

    // dotted grid
    ctx.fillStyle = "#141a24";
    for (let x = 12; x < W; x += 26) for (let y = 12; y < H; y += 26) ctx.fillRect(x, y, 1.6, 1.6);

    // links (bezier)
    for (const l of g.links) {
      const a = g.nodes.find((n) => n.id === l.from);
      const b = g.nodes.find((n) => n.id === l.to);
      if (!a || !b) continue;
      this.wire(ctx, a.x + NODE_W, a.y + NODE_H / 2, b.x, b.y + NODE_H / 2, "#2ee6ff");
    }
    if (g.linking && mousePos) {
      const a = g.nodes.find((n) => n.id === g.linking.fromId);
      if (a) this.wire(ctx, a.x + NODE_W, a.y + NODE_H / 2, mousePos.x, mousePos.y, "#ffc857");
    }

    // nodes
    for (const n of g.nodes) {
      const def = CoreTaskCodeRegistry[n.type] || { title: n.type, accent: "#8b97a8", icon: "?" };
      const sel = g.selectedNodeId === n.id;
      ctx.save();
      ctx.shadowColor = sel ? def.accent : "rgba(0,0,0,.5)";
      ctx.shadowBlur = sel ? 18 : 8;
      ctx.fillStyle = "#10151d";
      this.roundRect(ctx, n.x, n.y, NODE_W, NODE_H, 10);
      ctx.fill();
      ctx.restore();
      ctx.strokeStyle = sel ? def.accent : "#28303e";
      ctx.lineWidth = sel ? 1.8 : 1.2;
      this.roundRect(ctx, n.x, n.y, NODE_W, NODE_H, 10);
      ctx.stroke();

      // header bar
      ctx.fillStyle = def.accent + "22";
      this.roundRectTop(ctx, n.x, n.y, NODE_W, 30, 10);
      ctx.fill();
      ctx.fillStyle = def.accent;
      ctx.font = "12px monospace";
      ctx.fillText(`${def.icon} ${n.type}`, n.x + 10, n.y + 19);

      // body text
      ctx.fillStyle = "#8b97a8";
      ctx.font = "10.5px monospace";
      const propLine = Object.entries(n.properties || {}).map(([k, v]) => `${k}=${String(v).slice(0, 22)}`).join("  ")[0] === undefined ? "" :
        Object.entries(n.properties || {}).map(([k, v]) => `${k}=${String(v).slice(0, 22)}`).join(" ");
      this.clipText(ctx, propLine || "(defaults)", n.x + 10, n.y + 48, NODE_W - 20);
      this.clipText(ctx, `step-order y:${Math.round(n.y)}`, n.x + 10, n.y + 64, NODE_W - 20);

      // ports
      ctx.fillStyle = "#0c1017";
      ctx.strokeStyle = "#3dff9e"; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(n.x, n.y + NODE_H / 2, 6, 0, 7); ctx.fill(); ctx.stroke();
      ctx.strokeStyle = "#2ee6ff";
      ctx.beginPath(); ctx.arc(n.x + NODE_W, n.y + NODE_H / 2, 6, 0, 7); ctx.fill(); ctx.stroke();
      ctx.fillStyle = "#5a6577"; ctx.font = "9px monospace";
      ctx.fillText("IN", n.x - 7, n.y + NODE_H / 2 - 10);
      ctx.fillText("OUT", n.x + NODE_W - 12, n.y + NODE_H / 2 - 10);
    }

    if (g.nodes.length === 0) {
      ctx.fillStyle = "#39424f";
      ctx.font = "13px monospace";
      ctx.fillText("∅  Empty graph — drag a palette chip onto the canvas to begin compiling.", 24, H / 2);
    }
  },

  clipText(ctx, txt, x, y, maxW) {
    let t = txt;
    while (ctx.measureText(t).width > maxW && t.length > 3) t = t.slice(0, -2);
    ctx.fillText(t === txt ? t : t + "…", x, y);
  },

  wire(ctx, x1, y1, x2, y2, color) {
    ctx.strokeStyle = color;
    ctx.lineWidth = 1.6;
    ctx.setLineDash([]);
    ctx.beginPath();
    const dx = Math.max(40, Math.abs(x2 - x1) / 2);
    ctx.moveTo(x1, y1);
    ctx.bezierCurveTo(x1 + dx, y1, x2 - dx, y2, x2, y2);
    ctx.stroke();
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.arc(x2, y2, 3.4, 0, 7); ctx.fill();
  },

  roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  },
  roundRectTop(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.lineTo(x + w, y + h);
    ctx.lineTo(x, y + h);
    ctx.lineTo(x, y + r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  },
};
const NODE_W = 210, NODE_H = 86;

/* ============================================================================
 * ██ SECTION H — CHAT DIRECTIVE PARSER (formulation → workflow, Phase 1)
 * Natural language is parsed into typed nodes; every token passes L1 first.
 * ==========================================================================*/
const ChatCompiler = {
  parse(text) {
    const nodes = [];
    const lower = text.toLowerCase();
    const dirMatch = text.match(/(?:list|show|scan)\s+(?:the\s+)?(?:contents?\s+(?:of\s+)?)?([~\/\w\.\-\s]+?)(?:\s+(?:folder|directory|dir)|\s*$|\s+and\s+|\s+then\s+)/i);
    if (/list|scan|contents|files in|directory/.test(lower)) {
      nodes.push({ type: "directory_list", properties: { directoryRoute: (dirMatch && dirMatch[1].trim()) || "~" } });
    }
    const fileMatch = text.match(/(?:read|open|summarize|process|ingest)\s+(?:the\s+)?(?:file\s+)?([~\/\w\.\-\/]+\.\w+)/i);
    if (fileMatch) {
      nodes.push({ type: "file_reader", properties: { path: fileMatch[1] } });
    }
    if (/summar|analy|explain|infer|ollama|model|ai\b/.test(lower)) {
      nodes.push({
        type: "ollama_inference",
        properties: {
          model: AppStore.settings.defaultModel,
          systemInstructions: text.replace(/^(please\s+)?(list|scan|read|open|summarize)\s+/i, "").slice(0, 200) || "Summarize the ingested stream.",
        },
      });
    }
    if (nodes.length === 0) {
      nodes.push({ type: "directory_list", properties: { directoryRoute: "~" } });
    }
    return nodes;
  },

  handleSend(rawText) {
    const text = (rawText || "").trim();
    if (!text) return;
    AppStore.chat.log.push({ who: "user", text });

    if (SecurityShieldSanitizer.isPromptInjection(text)) {
      AppStore.audit.threatsBlocked++;
      AppStore.chat.log.push({
        who: "system",
        text: "⛨ JAILBREAK GRAMMAR DETECTED — directive quarantined at Level 1. The phrase pattern matches known prompt-injection signatures. Your request was NOT compiled. See Security Audit view for the trace.",
      });
      PipelineOrchestrator.emulateAttack(text, "Chat directive");
      UI.refreshChatView();
      UI.refreshTopbarPills();
      return;
    }

    const parsed = this.parse(text);
    // Replace graph with parsed nodes so the inspector shows the derivation.
    AppStore.graph.nodes = parsed.map((p, i) => {
      const def = CoreTaskCodeRegistry[p.type];
      return { id: "c" + AppStore.graph.nextId++, type: p.type, x: 30, y: 24 + i * 130, title: def.title, properties: p.properties };
    });
    AppStore.graph.links = [];
    AppStore.chat.log.push({
      who: "agent",
      text: `Parsed into ${parsed.length} workflow node(s): ${parsed.map((p) => p.type).join(" → ")}. Compiling through the zero-trust pipeline…`,
    });

    const report = PipelineOrchestrator.run(false); // compile + validate
    if (report && report.isPassed && !AppStore.settings.dryRunMode) {
      const ok = BridgeTransport.sendExecute(AppStore.runtime.lastCompiledScript, report);
      AppStore.chat.log.push({ who: "agent", text: ok ? "Frame dispatched to bridge. Streaming results below…" : "Bridge offline — script compiled but not sent." });
    } else if (report && report.isPassed) {
      AppStore.chat.log.push({ who: "agent", text: "Dry-run complete. Compiled artifact staged — disarm Defensive Visualizer Mode to execute on the host." });
    } else {
      AppStore.chat.log.push({ who: "system", text: "⛨ Level-3 validation HALTED this directive. Inspect the Security Audit view for risk details." });
    }
    UI.refreshChatView();
    UI.refreshTopbarPills();
  },
};

/* ============================================================================
 * ██ SECTION I — UI CONTROLLER (renderers + bindings)
 * ==========================================================================*/
const UI = {
  esc(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  },

  consoleEl(id) { return document.getElementById(id); },

      el.scrollTop = el.scrollHeight;
    });

  refreshTopbarPills() {

  refreshCanvasArtifacts() {
    const jp = document.getElementById("json-preview");
    if (jp) jp.textContent = AppStore.runtime.lastWorkflowJSON
      ? JSON.stringify(AppStore.runtime.lastWorkflowJSON, null, 2)

  highlightBash(script) {
    const dangerWords = /\b(rm|sudo|nc|curl|wget|chmod|chown|mkfs|dd|eval)\b/g;
    let html = this.esc(script);
    html = html.replace(dangerWords, (m) => `<span class="hl-risk">${m}</span>`);
    html = html.replace(/^(!\[\/bin\/bash|# ={5,}|# -{5,})/gm, (m) => `<span class="hl-meta">${m}</span>`);
    html = html.replace(/(\[GUI_RUNTIME\][^"<\n]*)/g, '<span class="hl-ok">$1</span>');
    return html;

  refreshAuditPanels() {
    const verdict = document.getElementById("audit-verdict");

    verdict.textContent = rep ? (rep.isPassed ? (AppStore.settings.dryRunMode ? "PASS · DRY-RUN" : "PASS · CLEARED") : "HALTED") : "IDLE";
    verdict.style.color = rep ? (rep.isPassed ? "var(--neon-green)" : "var(--neon-red)") : "var(--txt-faint)";
    document.getElementById("audit-size").textContent = AppStore.runtime.lastCompiledScript
      ? new Blob([AppStore.runtime.lastCompiledScript]).size + " B" : "0 B";
    document.getElementById("audit-risks").textContent = rep ? rep.identifiedRisks.length : "0";
    document.getElementById("audit-blocked").textContent = AppStore.audit.threatsBlocked;

    // Pipeline trace
    const pt = document.getElementById("pipeline-trace");
    if (pt) {
