        pt.innerHTML = `<div class="pipe-stage"><span class="stage-no">·</span><span>No pipeline run recorded yet.</span></div>`;
      } else {
        trace.forEach((s, i) => {
          const div = document.createElement("div");
          div.className = "pipe-stage " + (s.status === "hit" ? "hit" : s.status === "passed" ? "passed" : "");
          div.innerHTML = `<span class="stage-no">${i + 1}</span><span><b>${this.esc(s.stage)}</b> — <span style="color:${
            s.status === "hit" ? "var(--neon-red)" : s.status === "passed" ? "var(--neon-green)" : s.status === "blocked" ? "var(--neon-violet)" : "var(--neon-amber)"
          }">[${s.status.toUpperCase()}]</span> ${this.esc(s.note)}</span>`;
          pt.appendChild(div);
          if (i < trace.length - 1) {
            const arrow = document.createElement("div");
            arrow.className = "pipe-arrow";
            arrow.textContent = "▼";
            pt.appendChild(arrow);
          }
        });
      }
    }

    // Risk table
    const tb = document.getElementById("audit-table");
    if (tb) {
      tb.innerHTML = "";
      const risks = rep ? rep.identifiedRisks : [];
      if (risks.length === 0 && rep) {
        tb.innerHTML = `<tr><td>ALL-GATES</td><td><span class="tag pass">INFO</span></td><td>Full battery: header, guards, binaries, substitutions, paths, size budget</td><td><span class="tag pass">CLEARED</span></td></tr>`;
      } else if (risks.length === 0) {
        tb.innerHTML = `<tr><td colspan="4" class="hint">No audit executed yet.</td></tr>`;
      } else {
        risks.forEach((r, i) => {
          const tr = document.createElement("tr");
          tr.innerHTML = `<td>RISK-${String(i + 1).padStart(2, "0")}</td><td><span class="tag blocked">CRITICAL</span></td><td>${this.esc(r)}</td><td><span class="tag blocked">BLOCKED</span></td>`;
          tb.appendChild(tr);
        });
      }
    }

    // Registry dump
    const rd = document.getElementById("registry-dump");
    if (rd) {
      rd.textContent =
        "CORE TASK REGISTRY\n------------------\n" +
        Object.entries(CoreTaskCodeRegistry).map(([k, v]) => `  ${v.icon} ${k.padEnd(18)} ${v.title}`).join("\n") +
        "\n\nDEFENSE RULES (evaluateScriptSafetyScore)\n---------------------------------------\n" +
        [
          "REQ-01 shebang header must be '#!/bin/bash'",
          "REQ-02 'set -e' error-halt guard present",
          "REQ-03 'set -o pipefail' present",
          "BAN-01 sudo / su privilege escalation",
          "BAN-02 nc / ncat / telnet network hooks",
          "BAN-03 curl / wget remote fetch",
          "BAN-04 /etc/passwd|shadow credential paths",
          "BAN-05 /dev/tcp|udp reverse shells",
          "BAN-06 chmod 777 / chown permission abuse",
          "BAN-07 mkfs / dd raw disk mutation",
          "BAN-08 eval / pipe-to-shell chains",
          "BAN-09 bare ';' statement splitting",
          "BAN-10 $(...) and backtick substitution",
          "BAN-11 rm -rf / root deletion",
          "CAP-01 script size within configured budget",
        ].join("\n");
    }
  },

  renderInspector(focusFirst) {
    const slot = document.getElementById("inspector-slot");
    if (!slot) return;
    const n = AppStore.graph.nodes.find((x) => x.id === AppStore.graph.selectedNodeId);
    if (!n) {
      slot.innerHTML = `<div class="inspector-empty">Select a node on the canvas to edit its parameter payload.</div>`;
      return;
    }
    const def = CoreTaskCodeRegistry[n.type];
    slot.innerHTML = "";
    const head = document.createElement("div");
    head.style.cssText = "font-size:11px;letter-spacing:1px;color:" + def.accent + ";margin-bottom:8px";
    head.textContent = `${def.icon} ${def.title}  [${n.id}]`;
    slot.appendChild(head);

    def.fields.forEach((f, idx) => {
      const lab = document.createElement("label");
      lab.className = "field";
      const cap = document.createElement("span");
      cap.textContent = f.label;
      lab.appendChild(cap);
      let input;
      if (f.multiline) { input = document.createElement("textarea"); input.rows = 3; }
      else input = document.createElement("input");
      input.type = "text";
      input.value = n.properties[f.key] ?? "";
      input.placeholder = f.placeholder || "";
      input.addEventListener("input", () => {
        n.properties[f.key] = input.value;
        CanvasRenderer.draw();
        UI.refreshCanvasArtifacts();
      });
      lab.appendChild(input);
      slot.appendChild(lab);
      if (focusFirst && idx === 0) setTimeout(() => input.focus(), 30);
    });

    const del = document.createElement("button");
    del.className = "btn danger";
    del.textContent = "DELETE NODE";
    del.addEventListener("click", () => {
      const g = AppStore.graph;
      g.nodes = g.nodes.filter((x) => x.id !== n.id);
      g.links = g.links.filter((l) => l.from !== n.id && l.to !== n.id);
      g.selectedNodeId = null;
      UI.renderInspector();
      CanvasRenderer.draw();
      UI.refreshCanvasArtifacts();
    });
    slot.appendChild(del);
  },

  refreshChatView() {
    const logEl = document.getElementById("chat-log");
    if (!logEl) return;
    logEl.innerHTML = "";
    if (AppStore.chat.log.length === 0) {
      AppStore.chat.log.push({ who: "agent", text: "Workbench agent idle. Give me an operational directive (e.g. “list my Downloads folder then summarize ~/notes.txt”) — or try a jailbreak phrase to watch the shield react." });
    }
    for (const m of AppStore.chat.log) {
      const div = document.createElement("div");
      div.className = "chat-msg " + m.who;
      div.innerHTML = `<div class="who">${m.who === "user" ? "operator" : m.who === "agent" ? "workbench agent" : "security system"}</div><pre>${this.esc(m.text)}</pre>`;
      logEl.appendChild(div);
    }
    logEl.scrollTop = logEl.scrollHeight;

    const snap = document.getElementById("chat-store-snapshot");
    if (snap) {
      const clone = {
        connection: { endpoint: AppStore.connection.endpoint, status: AppStore.connection.status },
        settings: AppStore.settings,
        graph: { nodes: AppStore.graph.nodes.length, links: AppStore.graph.links.length },
        chatMessages: AppStore.chat.log.length,
        audit: { threatsBlocked: AppStore.audit.threatsBlocked, lastVerdict: AppStore.audit.lastReport ? (AppStore.audit.lastReport.isPassed ? "PASS" : "HALTED") : "idle" },
      };
      snap.textContent = JSON.stringify(clone, null, 2);
    }
    const ls = document.getElementById("chat-last-script");
    if (ls) ls.textContent = AppStore.runtime.lastCompiledScript || "// nothing compiled yet";
  },

  renderEmulationTrace(trace, caughtStages, label, raw, cleaned) {
    const host = document.getElementById("emu-trace");
    if (!host) return;
    host.innerHTML = "";
    trace.forEach((s, i) => {
      const div = document.createElement("div");
      div.className = "pipe-stage " + (s.status === "hit" || s.status === "blocked" ? "hit" : s.status === "passed" ? "passed" : "");
      div.innerHTML = `<span class="stage-no">${i + 1}</span><span><b>${this.esc(s.stage)}</b> — ${this.esc(s.note)}</span>`;
      host.appendChild(div);
      if (i < trace.length - 1) {
        const a = document.createElement("div"); a.className = "pipe-arrow"; a.textContent = "▼"; host.appendChild(a);
      }
    });

    const tb = document.getElementById("emu-table");
    if (tb) {
      const row = document.createElement("tr");
      const verdictTag = caughtStages.length
        ? `<span class="tag blocked">NEUTRALIZED</span>`
        : `<span class="tag pass">BENIGN</span>`;
      row.innerHTML = `<td>${this.esc(label)}</td><td>${this.esc(caughtStages.length ? caughtStages.join(" + ") : "none required")}</td><td>${verdictTag}</td>`;
      if (tb.rows.length === 1 && tb.querySelector(".hint")) tb.innerHTML = "";
      tb.appendChild(row);
    }
    const q = document.getElementById("emu-quarantine");
    if (q) q.textContent = `RAW CAPTURED:\n${raw}\n\nPOST-SANITIZATION BUFFER (quarantined):\n${cleaned}`;
  },

  syncSettingsView() {
    const set = (id, val) => { const el = document.getElementById(id); if (el) el.value = val; };
    const chk = (id, val) => { const el = document.getElementById(id); if (el) el.checked = val; };
    set("set-endpoint", AppStore.connection.endpoint);
    set("set-model", AppStore.settings.defaultModel);
    set("set-maxlen", AppStore.settings.maxScriptBytes);
    chk("set-dryrun", AppStore.settings.dryRunMode);
    chk("set-strictpaths", AppStore.settings.strictPaths);
    chk("set-auditlog", AppStore.settings.verboseAudit);
    chk("chk-dryrun-canvas", AppStore.settings.dryRunMode);
  },
};

/* ============================================================================
 * ██ SECTION J — VIEW BINDINGS (called after every router swap)
 * ==========================================================================*/
const ViewBindings = {
  bind(routeKey) {
    const on = (id, ev, fn) => { const el = document.getElementById(id); if (el) el.addEventListener(ev, fn); };

    if (routeKey === "canvas") {
      CanvasRenderer.attach();
      document.querySelectorAll(".palette-chip").forEach((chip) => {
        chip.addEventListener("dragstart", (e) => e.dataTransfer.setData("text/plain", chip.dataset.type));
        chip.addEventListener("click", () => CanvasRenderer.addNode(chip.dataset.type));
      });
      on("btn-autolayout", "click", () => CanvasRenderer.autolayout());
      on("btn-clear-graph", "click", () => CanvasRenderer.clear());
      on("btn-compile", "click", () => {
        const rep = PipelineOrchestrator.run(false);
        UI.logAll(rep && rep.isPassed ? "ok" : "sec", rep ? `[PIPELINE] Verdict: ${rep.isPassed ? "PASS" : "HALTED"} · score ${rep.score}/100 · ${AppStore.audit.lastMs}ms` : "[PIPELINE] Compilation failed.");
      });
      on("btn-execute", "click", () => {
        if (AppStore.settings.dryRunMode) {
          UI.logAll("warn", "[DRY-RUN] EXECUTE suppressed by Defensive Visualizer Mode. Compile preview updated instead. Disarm dry-run in Settings or the canvas toggle to permit transmission.");
          PipelineOrchestrator.run(false);
          UI.syncSettingsView();
          return;
        }
        const rep = PipelineOrchestrator.run(true);
        if (rep && rep.isPassed) UI.logAll("ok", "[RUN] Cleared all gates — streaming host output below.");
      });
      on("btn-copy-script", "click", async () => {
        if (!AppStore.runtime.lastCompiledScript) return;
        try { await navigator.clipboard.writeText(AppStore.runtime.lastCompiledScript); UI.logAll("ok", "[UX] Compiled bash artifact copied to clipboard."); }
        catch { UI.logAll("sys", "[UX] Clipboard blocked by browser — select the text in the preview panel manually."); }
      });
      on("chk-dryrun-canvas", "change", (e) => {
        AppStore.settings.dryRunMode = e.target.checked;
        UI.refreshTopbarPills(); UI.syncSettingsView();
        UI.logAll(e.target.checked ? "warn" : "sec", `[MODE] Defensive Visualizer ${e.target.checked ? "ARMED — transmissions halted locally" : "DISARMED — live bridge transmit enabled"}`);
      });
      UI.renderInspector();
    }

    if (routeKey === "chat") {
      on("btn-chat-send", "click", () => {
        const inp = document.getElementById("chat-input");
        ChatCompiler.handleSend(inp.value);
        inp.value = "";
      });
      on("chat-input", "keydown", (e) => {
        if (e.key === "Enter") { const inp = e.target; ChatCompiler.handleSend(inp.value); inp.value = ""; }
      });
    }

    if (routeKey === "emulation") {
      const host = document.getElementById("preset-buttons");
      if (host) {
        host.innerHTML = "";
        ATTACK_PRESETS.forEach((p) => {
          const b = document.createElement("button");
          b.className = "btn";
          b.textContent = p.label;
          b.addEventListener("click", () => PipelineOrchestrator.emulateAttack(p.payload, p.label));
          host.appendChild(b);
        });
      }
      on("btn-emu-run", "click", () => {
        const t = document.getElementById("emu-custom").value;
        if (t.trim()) PipelineOrchestrator.emulateAttack(t, "Custom payload");
      });
      on("btn-emu-benign", "click", () => PipelineOrchestrator.emulateAttack(BENIGN_CONTROL.payload, BENIGN_CONTROL.label));
      on("btn-emu-all", "click", () => {
        UI.logAll("sec", "[EMULATION] ══ FIRING FULL ADVERSARIAL TEST SUITE ══");
        ATTACK_PRESETS.forEach((p, i) => setTimeout(() => PipelineOrchestrator.emulateAttack(p.payload, p.label), i * 120));
        setTimeout(() => PipelineOrchestrator.emulateAttack(BENIGN_CONTROL.payload, BENIGN_CONTROL.label), ATTACK_PRESETS.length * 120);
      });
    }

    if (routeKey === "settings") {
      on("set-endpoint", "change", (e) => {
        const v = e.target.value.trim();
        if (/^wss?:\/\/[\w\.\-]+(:\d+)?$/.test(v)) { AppStore.connection.endpoint = v; UI.logAll("net", `[NET] Endpoint retargeted → ${v}`); }
        else UI.logAll("err", "[NET] Rejected malformed endpoint URI (must be ws://host:port).");
        e.target.value = AppStore.connection.endpoint;
      });
      on("set-model", "change", (e) => { AppStore.settings.defaultModel = e.target.value; });
      on("set-maxlen", "change", (e) => {
        const n = parseInt(e.target.value, 10);
        if (n >= 1024 && n <= 262144) AppStore.settings.maxScriptBytes = n;
        e.target.value = AppStore.settings.maxScriptBytes;
      });
      on("set-dryrun", "change", (e) => { AppStore.settings.dryRunMode = e.target.checked; UI.refreshTopbarPills(); });
      on("set-strictpaths", "change", (e) => { AppStore.settings.strictPaths = e.target.checked; });
      on("set-auditlog", "change", (e) => { AppStore.settings.verboseAudit = e.target.checked; });
      on("btn-reset-state", "click", () => {
        AppStore.graph.nodes = []; AppStore.graph.links = []; AppStore.graph.selectedNodeId = null;
        AppStore.chat.log = [];
        AppStore.runtime.lastCompiledScript = ""; AppStore.runtime.lastWorkflowJSON = null;
        AppStore.audit.lastReport = null; AppStore.audit.lastTrace = null;
        UI.logAll("sys", "[STATE] Session memory store wiped (connection + security counters preserved).");
      });
    }
  },
};

/* ============================================================================
 * ██ SECTION K — BOOTSTRAP
 * ==========================================================================*/
(function bootstrap() {
  // Topbar wiring (lives outside the routed views → always present).
  document.getElementById("btn-connect").addEventListener("click", () => {
    if (AppStore.connection.status === "OPEN") {
      if (AppStore.connection.socket) AppStore.connection.socket.close();
      UI.logAll("net", "[NET] Manual disconnect requested.");
    } else BridgeTransport.connect();
  });

  // Seed a demo graph so first-time operators see a working pipeline instantly.
  const seed = [
    { type: "file_reader", props: { path: "~/projects/notes.txt" } },
    { type: "ollama_inference", props: { model: "llama3.2", systemInstructions: "Summarize the ingested file stream in three bullet points." } },
  ];
  seed.forEach((s, i) => {
    const def = CoreTaskCodeRegistry[s.type];
    AppStore.graph.nodes.push({ id: "n" + AppStore.graph.nextId++, type: s.type, x: 30 + i * 250, y: 24 + i * 130, title: def.title, properties: JSON.parse(JSON.stringify(s.props)) });
  });
  AppStore.graph.links.push({ from: AppStore.graph.nodes[0].id, to: AppStore.graph.nodes[1].id });

  Router.init();
  UI.refreshTopbarPills();
  UI.logAll("sys", "[BOOT] Visual AI Agent Workbench initialized. Zero external dependencies detected and loaded.");
  UI.logAll("warn", "[MODE] Defensive Visualizer Mode is ARMED by default — compile previews stay inside the browser until you disarm it.");
  UI.logAll("net", "[NET] Expected bridge: python3 bridge_daemon.py → ws://localhost:8080");
})();
</script>
</body>
</html>
